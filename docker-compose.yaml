services:
  core-keeper:
    image: devidian/core-keeper-dedicated:sha-4220663c8d42f7a1df31e6ab2b698c0b8294a001
    entrypoint: ["/bin/bash", "/opt/ck/entrypoint.sh"]
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "27015:27015/udp"
    environment:
      DATA_PATH: /home/steam/core-keeper-data
      WORLD_ID: "${WORLD_ID:-0}"
      WORLD_NAME: "${WORLD_NAME:-AeTao}"
      SERVER_PORT: "${SERVER_PORT:-27015}"
      SERVER_PASSWORD: "${SERVER_PASSWORD}"
      MAX_PLAYERS: "${MAX_PLAYERS:-8}"
      UPDATE_ON_START: "${UPDATE_ON_START:-false}"
    volumes:
      # Absolute host path, not a repo file: Coolify's compose build pack copies only
      # docker-compose.yaml to the host (no git clone), so a bind of a tracked file
      # resolves to a path that does not exist and docker substitutes an empty dir.
      # Deploy a changed entrypoint with:
      #   curl -fsSL https://raw.githubusercontent.com/NaNomicon/core-keeper-server/main/entrypoint.sh \
      #     | ssh vps07 'cat > /srv/corekeeper/entrypoint.sh && chmod 755 /srv/corekeeper/entrypoint.sh'
      - /srv/corekeeper/entrypoint.sh:/opt/ck/entrypoint.sh:ro
      - /srv/corekeeper/server-files:/home/steam/core-keeper-dedicated
      - /srv/corekeeper/data:/home/steam/core-keeper-data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
